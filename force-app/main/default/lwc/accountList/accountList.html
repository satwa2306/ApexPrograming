<template>
    <lightning-card title="Account List" icon-name="standard:account">
        <!-- Filter Section -->
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <!-- Account Name Search -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-input
                        label="Account Name"
                        type="search"
                        value={searchKey}
                        onchange={handleSearchKeyChange}
                        placeholder="Search by name..."
                    ></lightning-input>
                </div>

                <!-- Industry Filter -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-combobox
                        label="Industry"
                        value={industry}
                        placeholder="Select Industry"
                        options={industryOptions}
                        onchange={handleIndustryChange}
                    ></lightning-combobox>
                </div>

                <!-- Rating Filter -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-combobox
                        label="Rating"
                        value={rating}
                        placeholder="Select Rating"
                        options={ratingOptions}
                        onchange={handleRatingChange}
                    ></lightning-combobox>
                </div>

                <!-- Min Revenue -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-input
                        label="Min Annual Revenue"
                        type="number"
                        value={minRevenue}
                        onchange={handleMinRevenueChange}
                        formatter="currency"
                        step="100000"
                    ></lightning-input>
                </div>

                <!-- Max Revenue -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4">
                    <lightning-input
                        label="Max Annual Revenue"
                        type="number"
                        value={maxRevenue}
                        onchange={handleMaxRevenueChange}
                        formatter="currency"
                        step="100000"
                    ></lightning-input>
                </div>

                <!-- Clear Filters Button -->
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-large-size_1-of-4 slds-align-bottom">
                    <lightning-button
                        label="Clear Filters"
                        onclick={handleClearFilters}
                        variant="neutral"
                        class="slds-m-top_medium"
                    ></lightning-button>
                </div>
            </div>
        </div>

        <!-- Data Table Section -->
        <template if:true={accounts.data}>
            <div class="slds-p-around_medium">
                <lightning-datatable
                    key-field="Id"
                    data={accounts.data}
                    columns={columns}
                    hide-checkbox-column
                    show-row-number-column
                    sorted-by={sortedBy}
                    sorted-direction={sortedDirection}
                    onsort={handleSort}
                >
                </lightning-datatable>
            </div>
        </template>

        <!-- Loading Spinner -->
        <template if:true={isLoading}>
            <div class="slds-p-around_medium slds-text-align_center">
                <lightning-spinner
                    alternative-text="Loading accounts..."
                    size="medium"
                ></lightning-spinner>
            </div>
        </template>

        <!-- Error Message -->
        <template if:true={accounts.error}>
            <div class="slds-p-around_medium">
                <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <h2>
                        Error loading accounts: {accounts.error.body.message}
                    </h2>
                </div>
            </div>
        </template>

        <!-- No Records Message -->
        <template if:true={showNoRecords}>
            <div class="slds-p-around_medium slds-text-align_center">
                <p class="slds-text-color_weak">No accounts found matching the selected filters.</p>
            </div>
        </template>
    </lightning-card>
</template>
